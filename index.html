<!-- [20/11/2026] HỎI GEMINI CHAT: dán khối này NGAY TRƯỚC thẻ </body> (sau khối <script> chính). Không sửa code cũ. Tắt: BAT_GEMINI_CHAT = false -->
<script>
// ===================== [20/11/2026] HỎI GEMINI CHAT (GỘP NHIỀU CÂU) + DÁN LỜI GIẢI =====================
// Dùng lượt chat miễn phí của gemini.google.com, KHÔNG tốn lượt API:
//   1. Tích chọn nhiều câu (khuyên 5-8 câu/lô) → bấm "Hỏi Gemini chat": trang soạn lời nhắc, chép vào clipboard, mở Gemini chat.
//   2. Dán lời nhắc vào Gemini chat, chờ giải, chép toàn bộ câu trả lời.
//   3. Quay lại trang, bấm "Dán lời giải": trang tách theo mã câu (### <mã câu>), hiện bảng xem trước (khớp / thiếu / mã lạ),
//      thầy bấm "Áp dụng" thì mới điền ĐÁP ÁN + LỜI GIẢI vào đúng câu.
// Chỉ điền trên trang, CHƯA ghi về Sheet, KHÔNG đổi trạng thái "Cần người xem": thầy xem rồi bấm Duyệt như thường.
// Tắt tính năng: đặt BAT_GEMINI_CHAT = false (trang chạy y như bản cũ). Khối này chỉ THÊM, không sửa code cũ.
const BAT_GEMINI_CHAT = true;
const GEMINI_CHAT_URL = 'https://gemini.google.com/app';
const GEMINI_CHAT_TOI_DA = 8;   // quá số này Gemini chat dễ cắt giữa chừng → hỏi lại thầy
let _gchatLoCuoi = [];          // mã các câu trong lô vừa hỏi (để báo "thiếu" khi dán thiếu câu)
let _gchatLoiNhac = '';         // lời nhắc gần nhất (cho nút "Chép lại")
let _gchatHang = [];            // các dòng của bảng xem trước

(function () {
    if (!BAT_GEMINI_CHAT) return;

    const TEN_DANG_NHAC = { tn: 'Trắc nghiệm nhiều lựa chọn', ds: 'Đúng/sai', ngan: 'Trả lời ngắn', tuluan: 'Tự luận' };
    const DS_THE = '#danh-sach-cau-hoi .question-card';
    const chiSoCua = card => { const v = card.querySelector('[id^="vung_tra_loi_"]'); return v ? parseInt(v.id.replace('vung_tra_loi_', ''), 10) : -1; };
    const ghiLog = chu => { const l = document.getElementById('terminal-log'); if (l) l.innerHTML += `<div>[${new Date().toLocaleTimeString()}] ${chu}</div>`; };

    // ---------- Câu có hình / bảng: Gemini chat chỉ nhận chữ ----------
    function gchatLoaiHinh(card, index) {
        if ((card._anh || []).length) return 'hinh';
        const nd = (document.getElementById(`noi_dung_${index}`) || {}).value || '';
        if (/(hình\s*(vẽ|bên|dưới|sau|\d)|như hình|đồ thị|sơ đồ|biểu đồ|bảng\s*(số liệu|sau|dưới|\d)|\|\s*-{2,})/i.test(nd)) return 'nhac';
        return '';
    }

    // ---------- Thêm ô chọn vào đầu mỗi thẻ câu ----------
    function gchatThemOChon() {
        document.querySelectorAll(DS_THE).forEach(card => {
            if (card.querySelector('.gchat-chon')) return;
            const index = chiSoCua(card);
            const dau = card.firstElementChild;
            if (index < 0 || !dau) return;
            const loai = gchatLoaiHinh(card, index);
            const nhan = document.createElement('label');
            nhan.className = 'inline-flex items-center gap-2 px-2.5 py-1 rounded-lg bg-slate-800/80 border border-slate-700 text-[11px] text-slate-300 cursor-pointer select-none';
            nhan.title = 'Tích để đưa câu này vào lô hỏi Gemini chat';
            nhan.innerHTML = `<input type="checkbox" class="gchat-chon accent-indigo-500 w-4 h-4" data-index="${index}">
                <span>Hỏi chat</span>` +
                (loai === 'hinh' ? '<span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-semibold">Có hình</span>' : '') +
                (loai === 'nhac' ? '<span class="px-1.5 py-0.5 rounded bg-amber-500/20 text-amber-300 font-semibold">Nhắc hình/bảng</span>' : '');
            dau.insertBefore(nhan, dau.firstChild);
            nhan.querySelector('input').addEventListener('change', gchatCapNhatDem);
        });
        gchatCapNhatDem();
    }

    function gchatCacCauChon() {
        return Array.from(document.querySelectorAll(`${DS_THE} .gchat-chon:checked`)).map(cb => {
            const card = cb.closest('.question-card');
            return { card, index: parseInt(cb.dataset.index, 10), ma: card.dataset.ma || '' };
        }).filter(x => x.ma);
    }

    function gchatCapNhatDem() {
        const n = gchatCacCauChon().length;
        const nut = document.getElementById('gchat-nut-hoi');
        if (nut) nut.innerHTML = `<i class="fa-solid fa-comments mr-1"></i> Hỏi Gemini chat (${n})`;
    }

    // Chọn nhanh: tất cả câu KHÔNG có hình (hoặc bỏ chọn nếu đã chọn hết)
    function gchatChonNhanh() {
        const cb = Array.from(document.querySelectorAll(`${DS_THE} .gchat-chon`)).filter(c => {
            const card = c.closest('.question-card');
            return !gchatLoaiHinh(card, parseInt(c.dataset.index, 10));
        });
        if (!cb.length) { alert('Chưa có câu nào đang hiện (hoặc tất cả đều có hình). Thầy bấm "Hiện ~20 câu cần duyệt" trước.'); return; }
        const daChonHet = cb.every(c => c.checked);
        cb.forEach(c => { c.checked = !daChonHet; });
        gchatCapNhatDem();
    }

    // ---------- Soạn lời nhắc ----------
    function gchatSoanLoiNhac(ds) {
        const kh = [
            'Bạn là giáo viên Vật lí THPT giàu kinh nghiệm. Hãy giải ' + ds.length + ' câu dưới đây. Mỗi câu giải độc lập, chỉ MỘT cách giải, đủ các bước nhưng ngắn gọn.',
            '',
            'ĐỊNH DẠNG TRẢ LỜI BẮT BUỘC: trả lời đúng ' + ds.length + ' khối, mỗi khối bắt đầu bằng một dòng ### kèm mã câu. Giữ nguyên mã câu, không đổi, không bỏ câu, không viết lời dẫn hay kết luận ngoài các khối:',
            '',
            '### <mã câu>',
            'ĐÁP ÁN: <đáp án>',
            'LỜI GIẢI: <lời giải chi tiết>',
            '',
            'Quy ước:',
            '- ĐÁP ÁN: câu nhiều lựa chọn chỉ ghi một chữ A, B, C hoặc D. Câu đúng/sai ghi dạng a) Đ, b) S, c) Đ, d) S. Câu trả lời ngắn hoặc tự luận ghi đáp số cuối cùng kèm đơn vị.',
            '- Mọi công thức, số liệu, đơn vị viết bằng LaTeX trong $...$ (công thức đứng riêng một dòng dùng $$...$$). Số thập phân dùng dấu phẩy. Không dùng kí tự Unicode như ², ω, √ ở ngoài $...$.',
            '- Dòng cuối của LỜI GIẢI ghi kết luận trùng khớp ĐÁP ÁN (ví dụ: Chọn B).',
            '- Không bọc cả câu trả lời trong khối mã.',
            '',
            '=== DANH SÁCH CÂU ==='
        ];
        ds.forEach(x => {
            const nd = ((document.getElementById(`noi_dung_${x.index}`) || {}).value || '').trim();
            const pa = Array.from(x.card.querySelectorAll(`.pa-input-${x.index}`)).map(o => o.value.trim()).filter(Boolean);
            kh.push('', '### ' + x.ma, 'Dạng: ' + (TEN_DANG_NHAC[x.card.dataset.dang] || 'Nhiều lựa chọn'), 'Nội dung: ' + nd);
            if (pa.length) { kh.push('Phương án:'); pa.forEach(p => kh.push(p)); }
        });
        return kh.join('\n');
    }

    function gchatChep(text) {
        let ok = false;
        try {
            const ta = document.createElement('textarea');
            ta.value = text; ta.style.cssText = 'position:fixed;top:0;left:0;opacity:0';
            document.body.appendChild(ta); ta.select();
            ok = document.execCommand('copy'); ta.remove();
        } catch (e) { }
        if (!ok && navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).catch(() => { });
        return ok;
    }

    function gchatHienThongBao(n, boQua) {
        let o = document.getElementById('gchat-thong-bao');
        if (!o) {
            o = document.createElement('div');
            o.id = 'gchat-thong-bao';
            o.className = 'fixed bottom-4 right-4 z-[60] max-w-sm bg-slate-900 border border-indigo-500/50 rounded-xl p-4 text-xs text-slate-200 shadow-2xl space-y-2';
            document.body.appendChild(o);
        }
        o.innerHTML = `<div class="font-semibold text-indigo-300"><i class="fa-solid fa-comments mr-1"></i> Đã chép lời nhắc ${n} câu vào clipboard</div>
            <div>Dán (Ctrl+V) vào Gemini chat, chờ giải xong, chép toàn bộ câu trả lời rồi bấm <b class="text-white">"Dán lời giải"</b>.</div>
            ${boQua ? `<div class="text-amber-300">Đã bỏ ${boQua} câu có hình khỏi lô.</div>` : ''}
            <div class="flex flex-wrap gap-2 pt-1">
                <button type="button" onclick="gchatChepLai()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-slate-700 border border-slate-700 font-semibold cursor-pointer">Chép lại</button>
                <a href="${GEMINI_CHAT_URL}" target="_blank" rel="noopener" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white font-semibold">Mở Gemini chat</a>
                <button type="button" onclick="gchatMoHop()" class="px-3 py-1.5 rounded-lg bg-emerald-600 hover:bg-emerald-500 text-white font-semibold cursor-pointer">Dán lời giải</button>
                <button type="button" onclick="this.closest('#gchat-thong-bao').remove()" class="px-2 py-1.5 text-slate-400 hover:text-white cursor-pointer">Đóng</button>
            </div>`;
    }

    window.gchatChepLai = function () {
        if (!_gchatLoiNhac) return;
        if (gchatChep(_gchatLoiNhac)) ghiLog('Đã chép lại lời nhắc Gemini chat.');
        else alert('Trình duyệt chặn việc chép. Thầy thử lại hoặc cấp quyền clipboard cho trang.');
    };

    window.gchatHoi = function () {
        let ds = gchatCacCauChon();
        if (!ds.length) { alert('Thầy tích ô "Hỏi chat" ở đầu các câu cần hỏi (hoặc bấm "Chọn câu không hình"), rồi bấm lại.'); return; }
        const coHinh = ds.filter(x => gchatLoaiHinh(x.card, x.index) === 'hinh');
        let boQua = 0;
        if (coHinh.length && confirm(`${coHinh.length} câu có hình. Gemini chat chỉ nhận chữ nên dễ giải sai.\n\nOK = bỏ các câu có hình khỏi lô.\nHuỷ = vẫn giữ (thầy tự đính kèm ảnh vào Gemini chat).`)) {
            ds = ds.filter(x => !coHinh.includes(x)); boQua = coHinh.length;
        }
        if (!ds.length) return;
        if (ds.length > GEMINI_CHAT_TOI_DA && !confirm(`Lô có ${ds.length} câu, nhiều hơn ${GEMINI_CHAT_TOI_DA}. Gemini chat có thể cắt giữa chừng, khi đó thầy hỏi lại riêng câu thiếu. Vẫn tiếp tục?`)) return;
        _gchatLoiNhac = gchatSoanLoiNhac(ds);
        _gchatLoCuoi = ds.map(x => x.ma);
        const ok = gchatChep(_gchatLoiNhac);
        window.open(GEMINI_CHAT_URL, '_blank');
        gchatHienThongBao(ds.length, boQua);
        ghiLog(`Hỏi Gemini chat: lô ${ds.length} câu${ok ? ', đã chép vào clipboard' : ' (chưa chắc đã chép được, bấm "Chép lại")'}.`);
    };

    // ---------- Tách câu trả lời theo mã câu ----------
    const sachDong = s => String(s).replace(/[#*`_>\[\]]/g, ' ').replace(/\s+/g, ' ').trim();

    function gchatTachKhoi(text, cacMa) {
        const dong = String(text || '').replace(/\r\n?/g, '\n').split('\n').filter(l => !/^\s*```/.test(l));
        const bietMa = cacMa.slice().sort((a, b) => b.length - a.length);
        const khoi = [];
        let cur = null;
        for (const l of dong) {
            const coThang = /^[\s>*_]*#{2,4}/.test(l);
            const s = sachDong(l), sLow = s.toLowerCase();
            let ma = null, biet = false;
            const tim = bietMa.find(m => sLow.includes(m.toLowerCase()) && (coThang || sLow === m.toLowerCase() || sLow.replace(/^(mã câu|mã|câu)\s*:?\s*/i, '') === m.toLowerCase()));
            if (tim) { ma = tim; biet = true; }
            else if (coThang) {
                const t = s.match(/[A-Za-z0-9]+(?:-[A-Za-z0-9]+)+/);
                if (t) ma = t[0];
            }
            if (ma) { cur = { ma, biet, dong: [] }; khoi.push(cur); continue; }
            if (cur) cur.dong.push(l);
        }
        return khoi;
    }

    function gchatDocKhoi(dong) {
        const reDA = /^[\s>*_]*ĐÁP\s*(?:ÁN|SỐ)(?:\s*CUỐI)?\s*\**\s*[:：]\s*\**\s*(.*)$/i;
        const reLG = /^[\s>*_]*LỜI\s*GIẢI(?:\s*CHI\s*TIẾT)?\s*\**\s*(?:[:：]|$)\s*\**\s*(.*)$/i;
        let dapAn = '', loi = [], trongLoi = false, daCoLoi = false;
        for (const l of dong) {
            if (!trongLoi) {
                const g = l.match(reLG);
                if (g) { trongLoi = true; daCoLoi = true; if (g[1].trim()) loi.push(g[1]); continue; }
                const d = l.match(reDA);
                if (d && !dapAn) { dapAn = d[1]; continue; }
            } else loi.push(l);
        }
        let loiText = loi.join('\n').replace(/\*\*/g, '').trim();
        if (!dapAn && daCoLoi) {   // Gemini đảo thứ tự: đáp án nằm cuối lời giải
            const cuoi = loiText.split('\n').reverse().find(l => reDA.test(l));
            if (cuoi) dapAn = cuoi.match(reDA)[1];
        }
        return { dapAn, loi: loiText };
    }

    function gchatChuanDapAn(dang, s) {
        s = String(s || '').replace(/\*\*|`/g, '').trim();
        if (!s) return '';
        if (dang === 'tn') {
            const m = s.match(/(^|[^A-Za-z\u00C0-\u1EF9])([A-D])(?![A-Za-z\u00C0-\u1EF9])/);
            return m ? m[2] : '';
        }
        if (dang === 'ds') {
            const ds = tachDungSaiWeb(s);
            return ['a', 'b', 'c', 'd'].filter(k => ds[k]).map(k => `${k}) ${ds[k] === 'Đúng' ? 'Đ' : 'S'}`).join(', ');
        }
        return chuanHoaLatex(s);
    }

    // ---------- Hộp "Dán lời giải" + bảng xem trước ----------
    function gchatTaoHop() {
        if (document.getElementById('gchat-hop')) return;
        const hop = document.createElement('div');
        hop.id = 'gchat-hop';
        hop.className = 'fixed inset-0 z-[60] hidden items-start justify-center bg-black/70 p-3 overflow-y-auto';
        hop.innerHTML = `
            <div class="w-full max-w-4xl my-4 bg-slate-900 border border-indigo-500/40 rounded-2xl p-5 space-y-3 shadow-2xl">
                <div class="flex items-center justify-between gap-2">
                    <div class="text-sm font-bold text-white"><i class="fa-solid fa-paste text-indigo-400 mr-2"></i>Dán lời giải từ Gemini chat</div>
                    <button type="button" onclick="gchatDongHop()" class="text-slate-400 hover:text-white text-xs cursor-pointer"><i class="fa-solid fa-xmark mr-1"></i>Đóng</button>
                </div>
                <div class="flex flex-wrap gap-2">
                    <button type="button" onclick="gchatLayClipboard()" class="px-3 py-1.5 rounded-lg bg-slate-800 hover:bg-indigo-600 text-indigo-300 hover:text-white text-xs font-semibold border border-slate-700 cursor-pointer"><i class="fa-solid fa-clipboard mr-1"></i> Lấy từ clipboard</button>
                    <button type="button" onclick="gchatPhanTich()" class="px-3 py-1.5 rounded-lg bg-indigo-600 hover:bg-indigo-500 text-white text-xs font-semibold cursor-pointer"><i class="fa-solid fa-table-list mr-1"></i> Phân tích</button>
                </div>
                <textarea id="gchat-dan" rows="6" spellcheck="false" placeholder="Dán toàn bộ câu trả lời của Gemini chat vào đây (Ctrl+V)..." class="w-full bg-slate-950 border border-slate-700 rounded-xl p-3 text-xs text-white font-mono focus:outline-none focus:border-indigo-500"></textarea>
                <div id="gchat-bang" class="space-y-2"></div>
                <div class="flex flex-wrap items-center justify-between gap-2 pt-1">
                    <div class="text-[11px] text-slate-500">Chỉ điền trên trang, chưa ghi về Sheet. Câu vẫn ở trạng thái "Cần người xem"; thầy xem rồi bấm Duyệt.</div>
                    <button type="button" id="gchat-ap-dung" onclick="gchatApDungTatCa()" class="hidden px-5 py-2 rounded-xl bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-semibold cursor-pointer"><i class="fa-solid fa-check mr-1"></i> Áp dụng các câu đã tích</button>
                </div>
            </div>`;
        hop.addEventListener('mousedown', e => { if (e.target === hop) gchatDongHop(); });
        document.body.appendChild(hop);
        document.getElementById('gchat-dan').addEventListener('paste', () => setTimeout(gchatPhanTich, 60));
    }

    window.gchatMoHop = function () {
        gchatTaoHop();
        const hop = document.getElementById('gchat-hop');
        hop.classList.remove('hidden'); hop.classList.add('flex');
        setTimeout(() => document.getElementById('gchat-dan').focus(), 50);
    };
    window.gchatDongHop = function () {
        const hop = document.getElementById('gchat-hop');
        if (hop) { hop.classList.add('hidden'); hop.classList.remove('flex'); }
    };
    window.gchatLayClipboard = function () {
        if (!navigator.clipboard || !navigator.clipboard.readText) { alert('Trình duyệt không cho đọc clipboard. Thầy bấm vào ô rồi dán bằng Ctrl+V.'); return; }
        navigator.clipboard.readText().then(t => { document.getElementById('gchat-dan').value = t; gchatPhanTich(); })
            .catch(() => alert('Trình duyệt không cho đọc clipboard. Thầy bấm vào ô rồi dán bằng Ctrl+V.'));
    };

    window.gchatPhanTich = function () {
        const text = document.getElementById('gchat-dan').value;
        const bang = document.getElementById('gchat-bang');
        const nutAp = document.getElementById('gchat-ap-dung');
        _gchatHang = [];
        if (!text.trim()) { bang.innerHTML = '<div class="text-xs text-slate-500 italic">Chưa có nội dung để phân tích.</div>'; nutAp.classList.add('hidden'); return; }
        const cacThe = Array.from(document.querySelectorAll(DS_THE)).filter(c => c.dataset.ma);
        const theoMa = new Map(cacThe.map(c => [c.dataset.ma.toLowerCase(), c]));
        const khoi = gchatTachKhoi(text, cacThe.map(c => c.dataset.ma));
        const daCo = new Set();
        khoi.forEach(k => {
            if (!k.biet) { _gchatHang.push({ loai: 'la', ma: k.ma, ghi: ['Mã này không có trong danh sách đang hiện'] }); return; }
            const card = theoMa.get(k.ma.toLowerCase());
            if (!card || daCo.has(card.dataset.ma.toLowerCase())) return;
            daCo.add(card.dataset.ma.toLowerCase());
            const index = chiSoCua(card), dang = card.dataset.dang;
            const { dapAn: daTho, loi } = gchatDocKhoi(k.dong);
            const dapAn = gchatChuanDapAn(dang, daTho);
            const ghi = [];
            if (!dapAn) ghi.push('Thiếu đáp án');
            if (!loi) ghi.push('Thiếu lời giải');
            if (dang === 'ds' && dapAn) {
                const nY = card.querySelectorAll(`.pa-input-${index}`).length;
                const nDa = dapAn.split(',').length;
                if (nY && nDa < nY) ghi.push(`Mới có ${nDa}/${nY} ý`);
            }
            const dapCu = layDapAn(card, index, dang) || '';
            const sk = dapAn ? soSanhDapAnGemini(dang, dapCu, dapAn) : null;
            const lech = loi ? kiemTraThongNhat(dang, loi, dapAn) : '';
            if (lech) ghi.push(lech);
            _gchatHang.push({ loai: ghi.some(g => /^Thiếu|^Mới có/.test(g)) ? 'thieu' : 'khop', card, index, dang, ma: card.dataset.ma, dapAn, loi, dapCu, sk, ghi, canhBao: !!lech });
        });
        _gchatLoCuoi.forEach(ma => {
            if (!daCo.has(ma.toLowerCase()) && theoMa.has(ma.toLowerCase()))
                _gchatHang.push({ loai: 'thieu', ma, ghi: ['Gemini chưa trả lời câu này (bị cắt hoặc bỏ sót): thầy hỏi lại riêng câu này'], khongAp: true });
        });
        gchatVeBang();
    };

    function gchatVeBang() {
        const bang = document.getElementById('gchat-bang');
        const nutAp = document.getElementById('gchat-ap-dung');
        if (!_gchatHang.length) {
            bang.innerHTML = '<div class="text-xs text-amber-400">Không tìm thấy khối nào bắt đầu bằng "### <mã câu>". Thầy kiểm tra Gemini có giữ đúng định dạng không.</div>';
            nutAp.classList.add('hidden'); return;
        }
        const nhan = { khop: ['Khớp', 'bg-emerald-500/15 text-emerald-300 border-emerald-500/30'], thieu: ['Thiếu', 'bg-amber-500/15 text-amber-300 border-amber-500/30'], la: ['Mã lạ', 'bg-rose-500/15 text-rose-300 border-rose-500/30'] };
        const dem = { khop: 0, thieu: 0, la: 0 };
        _gchatHang.forEach(r => dem[r.loai]++);
        const dong = _gchatHang.map((r, k) => {
            const apDuoc = !r.khongAp && r.loai !== 'la' && (r.dapAn || r.loi);
            const macDinh = apDuoc && r.loai === 'khop' && !r.canhBao;
            let so = '';
            if (r.sk === true) so = '<span class="text-emerald-400">trùng đáp án cũ</span>';
            else if (r.sk === false) so = `<span class="text-amber-300 font-semibold">KHÁC đáp án cũ (${escSua(r.dapCu)})</span>`;
            const xem = r.loi ? escSua(r.loi.replace(/\s+/g, ' ').slice(0, 130)) + (r.loi.length > 130 ? '…' : '') : '—';
            return `<tr class="border-t border-slate-800 align-top">
                <td class="p-2"><input type="checkbox" class="gchat-ap accent-emerald-500 w-4 h-4" data-k="${k}" ${apDuoc ? '' : 'disabled'} ${macDinh ? 'checked' : ''}></td>
                <td class="p-2 whitespace-nowrap">${r.card ? 'Câu ' + (r.index + 1) + '<br>' : ''}<span class="text-[10px] text-slate-500">${escSua(r.ma)}</span></td>
                <td class="p-2"><span class="px-2 py-0.5 rounded border text-[10px] font-semibold ${nhan[r.loai][1]}">${nhan[r.loai][0]}</span></td>
                <td class="p-2 whitespace-nowrap"><b class="text-white">${escSua(r.dapAn || '—')}</b><br>${so}</td>
                <td class="p-2 text-slate-300">${xem}${r.ghi.map(g => `<div class="text-amber-300">⚠️ ${escSua(g)}</div>`).join('')}</td>
            </tr>`;
        }).join('');
        bang.innerHTML = `<div class="text-xs text-slate-300">Khớp: <b class="text-emerald-300">${dem.khop}</b> · Thiếu: <b class="text-amber-300">${dem.thieu}</b> · Mã lạ: <b class="text-rose-300">${dem.la}</b>. Câu "Khớp" đã được tích sẵn; câu có cảnh báo thì thầy tự tích nếu muốn áp dụng.</div>
            <div class="overflow-x-auto"><table class="w-full text-[11px] text-left">
                <thead class="text-slate-400"><tr><th class="p-2 w-8"></th><th class="p-2">Câu</th><th class="p-2">Trạng thái</th><th class="p-2">Đáp án mới</th><th class="p-2">Lời giải / ghi chú</th></tr></thead>
                <tbody>${dong}</tbody></table></div>`;
        nutAp.classList.toggle('hidden', !_gchatHang.some(r => !r.khongAp && r.loai !== 'la' && (r.dapAn || r.loi)));
    }

    // ---------- Áp dụng lên thẻ (không ghi Sheet, không đổi trạng thái) ----------
    function gchatApMotCau(r) {
        const { card, index } = r;
        if (!card || !document.body.contains(card)) return false;
        const o = document.getElementById(`loi_giai_${index}`);
        if (!o) return false;
        const dang = card.dataset.dang;
        card._truocGemini = { dang, loiGiai: o.value, dapAn: layDapAn(card, index, dang) || '' };
        const canh = r.ghi.slice();
        if (r.loi) { o.value = chuanHoaLatex(r.loi); capNhatXemLoiGiai(index); }
        if (r.dapAn) {
            if (dang === r.dang) datDapAnTrenThe(card, index, dang, r.dapAn);
            else canh.push('Thầy đã đổi dạng câu nên chỉ điền lời giải, không điền đáp án.');
        }
        let dong = `✅ Gemini chat đã giải (dán thủ công) · Đáp án: <b>${escSua(r.dapAn || '—')}</b>`;
        if (r.sk === true) dong += ' · <b>trùng</b> đáp án cũ';
        if (r.sk === false) dong += ` · ⚠️ <b>KHÁC</b> đáp án cũ (cũ: ${escSua(r.dapCu)}), xem kỹ lời giải trước khi duyệt`;
        const html = dong + canh.map(c => `<div>⚠️ ${escSua(c)}</div>`).join('') +
            `<div class="text-slate-400">Chưa lưu về Sheet: thầy xem lại rồi bấm Duyệt. <button type="button" onclick="gchatHoanTac(${index})" class="underline font-semibold cursor-pointer">Hoàn tác</button></div>`;
        if (typeof hienTinGemini === 'function') hienTinGemini(index, (r.sk === false || canh.length) ? 'canh' : 'ok', html);
        return true;
    }

    window.gchatApDungTatCa = function () {
        const cacO = Array.from(document.querySelectorAll('#gchat-bang .gchat-ap:checked'));
        if (!cacO.length) { alert('Thầy tích ít nhất một câu để áp dụng.'); return; }
        let ok = 0;
        cacO.forEach(cb => { const r = _gchatHang[parseInt(cb.dataset.k, 10)]; if (r && gchatApMotCau(r)) ok++; });
        ghiLog(`Dán lời giải từ Gemini chat: đã điền ${ok}/${cacO.length} câu (bấm Duyệt từng câu để ghi về Google Sheet).`);
        gchatDongHop();
    };

    window.gchatHoanTac = function (index) {
        const cb = document.querySelector(`${DS_THE} .gchat-chon[data-index="${index}"]`);
        const card = cb && cb.closest('.question-card');
        const t = card && card._truocGemini;
        if (!t) return;
        const o = document.getElementById(`loi_giai_${index}`);
        if (o) { o.value = t.loiGiai; capNhatXemLoiGiai(index); }
        if (card.dataset.dang === t.dang) datDapAnTrenThe(card, index, t.dang, t.dapAn);
        card._truocGemini = null;
        if (typeof hienTinGemini === 'function') hienTinGemini(index, 'dang', 'Đã hoàn tác: trả lại lời giải và đáp án trước khi dán từ Gemini chat.');
    };

    // ---------- Gắn vào giao diện ----------
    function gchatGanNut() {
        const mau = document.querySelector('button[onclick^="giaiTatCaGemini"]');
        const thanh = mau ? mau.parentElement : document.querySelector('#can-duyet-section .flex.items-center.gap-2');
        if (!thanh || document.getElementById('gchat-nut-hoi')) return;
        const tao = (id, cls, html, onclick, tip) => {
            const b = document.createElement('button');
            if (id) b.id = id;
            b.type = 'button'; b.className = cls; b.innerHTML = html; b.title = tip;
            b.addEventListener('click', onclick);
            thanh.appendChild(b);
        };
        const lop = 'px-4 py-2 rounded-lg text-white text-xs font-semibold transition flex items-center gap-2 cursor-pointer ';
        tao('', lop + 'bg-slate-700 hover:bg-slate-600', '<i class="fa-solid fa-square-check mr-1"></i> Chọn câu không hình', gchatChonNhanh, 'Tích / bỏ tích tất cả câu không có hình để hỏi Gemini chat');
        tao('gchat-nut-hoi', lop + 'bg-sky-600 hover:bg-sky-500', '<i class="fa-solid fa-comments mr-1"></i> Hỏi Gemini chat (0)', gchatHoi, 'Soạn lời nhắc cho các câu đã tích, chép vào clipboard và mở Gemini chat (không tốn lượt API)');
        tao('', lop + 'bg-emerald-600 hover:bg-emerald-500', '<i class="fa-solid fa-paste mr-1"></i> Dán lời giải', gchatMoHop, 'Dán câu trả lời của Gemini chat để tự chia theo mã câu');
    }
    gchatGanNut();

    // Sau mỗi lần tải danh sách: thêm ô chọn vào các thẻ mới
    if (typeof window.taiCauHoiCanDuyet === 'function') {
        const goc = window.taiCauHoiCanDuyet;
        window.taiCauHoiCanDuyet = async function () {
            const kq = await goc.apply(this, arguments);
            try { gchatThemOChon(); } catch (e) { console.error(e); }
            return kq;
        };
    }
    // Câu được duyệt/loại thì thẻ biến mất → cập nhật số đếm
    const dsCau = document.getElementById("danh-sach-cau-hoi");
    if (dsCau) new MutationObserver(gchatCapNhatDem).observe(dsCau, { childList: true });
})();
// =================== HẾT PHẦN HỎI GEMINI CHAT ===================
</script>
