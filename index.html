<!DOCTYPE html>
<html lang="vi" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hệ Sinh Thái AI Vật Lí - Trung Tâm Điều Hành Agent</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Tích hợp MathJax để hiển thị chuẩn công thức Vật lí -->
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' }
        };
    </script>
    <script type="text/javascript" id="MathJax-script" async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkBg: '#0b0f19',
                        cardBg: '#111827',
                        cardHover: '#1f2937',
                        accentCyan: '#06b6d4',
                        accentBlue: '#3b82f6',
                        accentPurple: '#8b5cf6',
                        accentGreen: '#10b981'
                    }
                }
            }
        }
    </script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Phông chữ tiêu chuẩn hành chính theo Nghị định 30/2020/NĐ-CP (Times New Roman) -->
    <style>
        body {
            font-family: 'Times New Roman', Times, serif, sans-serif;
        }
    </style>
</head>
<body class="bg-darkBg text-gray-100 min-h-screen flex flex-col">

    <!-- Header / Navbar (Tối ưu chống tràn chữ trên điện thoại) -->
    <header class="bg-cardBg border-b border-gray-800 sticky top-0 z-50 px-3 py-2.5 shadow-md">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row justify-between items-center gap-2.5">
            <div class="flex items-center gap-2.5 w-full sm:w-auto justify-between">
                <div class="flex items-center gap-2.5">
                    <div class="w-9 h-9 rounded-xl bg-gradient-to-tr from-cyan-500 to-blue-600 flex items-center justify-center text-white shadow-lg shrink-0">
                        <i class="fa-solid fa-atom text-lg animate-spin" style="animation-duration: 12s;"></i>
                    </div>
                    <div>
                        <h1 class="font-bold text-sm sm:text-base text-white leading-tight">PHYSICS AGENT COMMANDER</h1>
                        <p class="text-[11px] text-cyan-400 font-medium">Hệ sinh thái AI & Kiểm định tự động - THPT Thủy Sơn</p>
                    </div>
                </div>
            </div>
            
            <div class="flex items-center justify-between sm:justify-end gap-2 w-full sm:w-auto pt-2 sm:pt-0 border-t sm:border-t-0 border-gray-800/80">
                <span class="px-2.5 py-1 bg-emerald-500/10 text-emerald-400 text-[11px] font-semibold rounded-full border border-emerald-500/20 flex items-center gap-1.5 whitespace-nowrap">
                    <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span> Trực tuyến: 10/10 Agent
                </span>
                <button onclick="triggerGlobalSync()" class="px-3 py-1.5 bg-gradient-to-r from-cyan-600 to-blue-600 hover:from-cyan-500 hover:to-blue-500 text-white text-xs font-semibold rounded-lg shadow-md transition-all flex items-center gap-1.5 whitespace-nowrap">
                    <i class="fa-solid fa-sync"></i> Đồng bộ toàn cục
                </button>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <div class="max-w-7xl mx-auto px-3 sm:px-4 py-5 flex-1 w-full grid grid-cols-1 lg:grid-cols-4 gap-5">
        
        <!-- Sidebar Navigation -->
        <aside class="lg:col-span-1 space-y-2">
            <div class="text-xs font-semibold text-gray-400 uppercase tracking-wider px-3 mb-2">Điều Hướng Hệ Thống</div>
            <nav class="grid grid-cols-2 sm:grid-cols-4 lg:grid-cols-1 gap-1.5 text-xs sm:text-sm font-medium">
                <a href="#health-section" class="flex items-center gap-2.5 px-3 py-2.5 rounded-xl text-gray-300 hover:bg-cardHover hover:text-white transition-all border border-transparent">
                    <i class="fa-solid fa-heart-pulse w-4 text-center text-emerald-400"></i> Sức Khỏe (10 Agent)
