<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PHYSICS AGENT COMMANDER - THPT Thủy Sơn</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        window.MathJax = {
            tex: { inlineMath: [['$', '$'], ['\\(', '\\)']] },
            svg: { fontCache: 'global' },
            startup: { typeset: false }
        };
    </script>
    <script src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js" async></script>
    <style>
        body { background-color: #0b0f19; color: #cbd5e1; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.75); backdrop-filter: blur(12px); border: 1px solid rgba(51, 65, 85, 0.4); }
        .glow-blue { box-shadow: 0 0 15px rgba(56, 189, 248, 0.15); }
        .agent-card { background: rgba(30, 41, 59, 0.5); border: 1px solid rgba(51, 65, 85, 0.6); transition: all 0.2s ease; }
        .agent-card:hover { border-color: rgba(56, 189, 248, 0.5); transform: translateY(-2px); }
        textarea { resize: vertical; min-height: 140px; }
        .tt { display: flex; align-items: center; gap: 4px; font-size: 10px; font-weight: 600; margin-top: 2px; }
        .tt .cham { width: 6px; height: 6px; border-radius: 9999px; flex-shrink: 0; }
        .tt-tot { color: #34d399; }
        .tt-tot .cham { background: #34d399; }
        .tt-chua-tot { color: #fb7185; }
        .tt-chua-tot .cham { background: #fb7185; }
        .logo-quay { display: inline-block; animation: nguyenTuQuay 6s linear infinite; }
        .logo-khung { animation: khungPhatSang 2.4s ease-in-out infinite; }
        @keyframes nguyenTuQuay { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes khungPhatSang {
            0%, 100% { box-shadow: 0 0 10px rgba(56, 189, 248, 0.35); }
            50% { box-shadow: 0 0 24px rgba(56, 189, 248, 0.75); }
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-6">
    <div class="max-w-7xl mx-auto space-y-6">
        <header class="glass-panel rounded-xl p-5 flex flex-col md:flex-row justify-between items-center gap-4 glow-blue">
            <div class="flex items-center gap-4">
                <div class="w-12 h-12 rounded-xl bg-gradient-to-br from-sky-500 to-blue-700 flex items-center justify-center logo-khung">
                    <i class="fa-solid fa-atom text-white text-2xl logo-quay"></i>
                </div>
                <div>
                    <h1 class="text-2xl font-extrabold tracking-wider text-white uppercase">PHYSICS AGENT COMMANDER</h1>
                    <p class="text-xs text-sky-400 font-medium">Hệ sinh thái AI & Kiểm định tự động - THPT Thủy Sơn</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <button onclick="taiCauHoiCanDuyet(true)" class="px-4 py-2 rounded-lg bg-sky-600 hover:bg-sky-500 text-white text-xs font-semibold transition flex items-center gap-2 cursor-pointer">
                    <i class="fa-solid fa-rotate"></i> Đồng bộ dữ liệu
                </button>
            </div>
        </header>

        <div class="space-y-6">
            <div id="can-duyet-section" class="glass-panel rounded-xl p-5 space-y-4 border-amber-500/30">
                <div class="flex justify-between items-center">
                    <h2 class="text-base font-bold text-white flex items-center gap-2">
                        <i class="fa-solid fa-clipboard-check text-amber-400"></i> Quản Lý & Duyệt Câu Hỏi
                    </h2>
                    <button onclick="taiCauHoiCanDuyet(true)" class="px-4 py-2 rounded-lg bg-amber-600 hover:bg-amber-500 text-white text-xs font-semibold transition cursor-pointer">
                        <i class="fa-solid fa-eye"></i> Hiện ~20 câu cần duyệt
                    </button>
                </div>
                <div id="danh-sach-cau-hoi" class="space-y-4 pt-2">
                    <div class="text-center py-8 text-slate-500 text-xs">Bấm nút "Hiện ~20 câu cần duyệt" ở trên để tải danh sách.</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        const GOOGLE_APPS_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxyAiTPgqKXcYCEXjjZeitkbSWOs5EtCKMzgJEUJpiEJBElxZQNFtSRt3NF88V0ajvH_Q/exec";

        function escSua(s) {
            return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
        }

        function hienCongThuc(s) {
            if (!s) return "";
            s = String(s);
            s = s.replace(/\\\\/g, '\\').replace(/\{,\}/g, ',');
            s = s.replace(/\$\$([\s\S]+?)\$\$|\$([^$]+?)\$/g, (m, k, d) => {
                const t = (k !== undefined ? k : d).replace(/(\d),(?=\d)/g, '$1{,}');
                return k !== undefined ? '$$' + t + '$$' : '$' + t + '$';
            });
            return s.replace(/<(?![a-zA-Z\/!])/g, '&lt;');
        }

        function veCongThuc(el, lan = 0) {
            if (window.MathJax && typeof MathJax.typesetPromise === 'function') {
                (MathJax.startup && MathJax.startup.promise ? MathJax.startup.promise : Promise.resolve())
                    .then(() => MathJax.typesetPromise(el ? [el] : undefined)).catch(err => console.warn('MathJax:', err));
            } else if (lan < 50) {
                setTimeout(() => veCongThuc(el, lan + 1), 200);
            }
        }

        function batSuaLoiGiai(index) {
            const xem = document.getElementById(`xem_loi_giai_${index}`);
            const ta = document.getElementById(`loi_giai_${index}`);
            const nut = document.getElementById(`nut_sua_lg_${index}`);
            if (!xem || !ta) return;
            xem.classList.add('hidden');
            ta.classList.remove('hidden');
            ta.focus();
            if (nut) nut.textContent = "Xong (Xem lại)";
        }

        function dongSuaLoiGiai(index) {
            const xem = document.getElementById(`xem_loi_giai_${index}`);
            const ta = document.getElementById(`loi_giai_${index}`);
            const nut = document.getElementById(`nut_sua_lg_${index}`);
            if (!xem || !ta) return;
            ta.classList.add('hidden');
            xem.classList.remove('hidden');
            xem.innerHTML = hienCongThuc(ta.value);
            veCongThuc(xem);
            if (nut) nut.textContent = "Sửa văn bản LaTeX";
        }

        async function taiCauHoiCanDuyet(chiCanDuyet = true) {
            const container = document.getElementById('danh-sach-cau-hoi');
            container.innerHTML = `<div class="text-center py-6 text-sky-400 text-xs"><i class="fa-solid fa-spinner fa-spin mr-2"></i> Đang tải dữ liệu câu hỏi từ questions.json...</div>`;

            let data = [];
            try {
                const response = await fetch('questions.json?t=' + Date.now());
                if (response.ok) { data = await response.json(); }
            } catch (err) {
                console.warn("Chưa đọc được questions.json:", err);
            }

            const dsHienThi = data.slice(0, 20);
            if (!dsHienThi || dsHienThi.length === 0) {
                container.innerHTML = `<div class="text-center py-6 text-amber-400 text-xs">Chưa có dữ liệu trong questions.json.</div>`;
                return;
            }

            container.innerHTML = '';
            dsHienThi.forEach((item, index) => {
                const card = document.createElement('div');
                card.className = "question-card bg-slate-900/90 border border-slate-800 rounded-xl p-5 space-y-4 shadow-lg";

                let html = `
                    <div class="flex justify-between items-center text-xs border-b border-slate-800 pb-3">
                        <span class="px-3 py-1 rounded-lg bg-sky-500/10 text-sky-400 font-bold border border-sky-500/20">Câu ${index + 1} [Mã: ${item.ma_cau || 'N/A'}]</span>
                        <span class="px-3 py-1 rounded-lg bg-amber-500/10 text-amber-400 text-xs font-semibold">${item.trang_thai || 'Cần người xem'}</span>
                    </div>
                    <div class="text-xs text-white leading-relaxed space-y-2">
                        <div><strong class="text-sky-300">Nội dung:</strong> <span>${hienCongThuc(item.noi_dung)}</span></div>
                    </div>
                    <div class="space-y-2 pt-2">
                        <div class="flex justify-between items-center text-xs font-semibold text-sky-300">
                            <span class="flex items-center gap-1.5"><i class="fa-solid fa-book-open-reader"></i> LỜI GIẢI CHI TIẾT:</span>
                            <button type="button" onclick="batSuaLoiGiai(${index})" id="nut_sua_lg_${index}" class="text-[11px] text-sky-400 hover:text-white underline cursor-pointer">Sửa văn bản LaTeX</button>
                        </div>
                        <div id="xem_loi_giai_${index}" class="w-full bg-slate-950 border border-slate-800 rounded-xl p-3 text-xs text-white leading-relaxed overflow-x-auto min-h-[90px]">
                            ${hienCongThuc(item.loi_giai || 'Chưa có lời giải chi tiết...')}
                        </div>
                        <textarea id="loi_giai_${index}" rows="4" onblur="dongSuaLoiGiai(${index})" class="hidden w-full bg-slate-950 border border-sky-500/40 rounded-xl p-3 text-xs text-white focus:outline-none focus:border-sky-500 leading-relaxed font-mono">${escSua(item.loi_giai || '')}</textarea>
                    </div>
                `;
                card.innerHTML = html;
                container.appendChild(card);
            });

            veCongThuc(container);
        }
    </script>
</body>
</html>
