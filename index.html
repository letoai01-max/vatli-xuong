<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ngân Hàng Câu Hỏi Vật Lí - Xưởng Thầy Toại</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #0d1117; color: #c9d1d9; margin: 0; padding: 20px; }
        .container { max-width: 900px; margin: 0 auto; }
        h1 { text-align: center; color: #58a6ff; }
        .question-card { background: #161b22; border: 1px solid #30363d; border-radius: 8px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .question-title { font-weight: bold; color: #f0f6fc; margin-bottom: 10px; font-size: 1.1em; }
        .question-image { text-align: center; margin-top: 15px; }
        .question-image img { max-width: 100%; max-height: 400px; border-radius: 6px; border: 1px solid #30363d; background: #fff; padding: 5px; }
        .loading { text-align: center; font-size: 1.2em; color: #8b949e; margin-top: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h1>Ngân Hàng Câu Hỏi & Hình Ảnh Vật Lí</h1>
    <div id="loading" class="loading">Đang tải dữ liệu từ Google Sheet...</div>
    <div id="questions-container"></div>
</div>

<script>
    // Sử dụng Google Sheets API công khai hoặc Published CSV link để fetch dữ liệu trực tiếp lên web
    // Thầy thay link CSV của Google Sheet vào đây (File -> Share -> Publish to web -> định dạng CSV)
    const SHEET_CSV_URL = "URL_FILE_CSV_GOOGLE_SHEET_CUA_THAY";

    async function loadData() {
        try {
            // Nếu dùng script Python xuất ra file json, ta có thể fetch file json trực tiếp từ kho GitHub:
            const response = await fetch('questions.json'); 
            const data = await response.json();
            
            const container = document.getElementById('questions-container');
            document.getElementById('loading').style.display = 'none';

            data.forEach((item, index) => {
                let card = document.createElement('div');
                card.className = 'question-card';

                let htmlContent = `<div class="question-title">Câu ${index + 1}: ${item.noi_dung}</div>`;

                // Nếu cột W có link ảnh, tự động đưa thẻ img vào đúng vị trí ngay dưới nội dung
                if (item.link_anh && item.link_anh.startsWith('http')) {
                    htmlContent += `
                        <div class="question-image">
                            <img src="${item.link_anh}" alt="Hình minh họa câu ${index + 1}">
                        </div>
                    `;
                }

                card.innerHTML = htmlContent;
                container.appendChild(card);
            });
        } catch (error) {
            document.getElementById('loading').innerText = "Không thể tải được dữ liệu. Thầy hãy cấu hình tệp nguồn JSON hoặc CSV!";
            console.error(error);
        }
    }

    loadData();
</script>

</body>
</html>
