name: Quet bu hinh anh tu Google Drive

on:
  schedule:
    - cron: "0 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ngan_hang
  cancel-in-progress: false

jobs:
  quet_anh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài đặt các thư viện phụ trợ
        run: pip install -q -r requirements.txt

      # [29/10/2026] Bỏ GEMINI_API_KEY, GEMINI_API_KEY_TRA_PHI: quet_bu_hinh_anh.py không gọi Gemini
      - name: Chạy script quét bù hình ảnh từ Google Drive
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python trung_tam.py quet_bu_hinh_anh.py

      - name: Tự động xuất lại questions.json sau khi quét ảnh
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python trung_tam.py xuat_de.py

      # [29/10/2026] Bỏ DeThi.docx (không còn được tạo). Tự lấy bản mới nhất và thử đẩy lại tối đa 3 lần,
      # để không bị từ chối khi Xuat_de vừa đẩy questions.json lên cùng lúc. Bản vừa xuất luôn được giữ.
      - name: Commit và đẩy questions.json, hình ảnh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p images
          git add questions.json images/
          if git diff --cached --quiet; then echo "Không có thay đổi mới."; exit 0; fi
          git commit -m "🤖 Tự động cập nhật questions.json và hình ảnh mới nhất từ Kho chung"
          for lan in 1 2 3; do
            if git pull --rebase -X theirs origin main && git push origin HEAD:main; then exit 0; fi
            echo "Nhánh main vừa thay đổi, thử lại lần $lan sau 10 giây…"
            sleep 10
          done
          exit 1
