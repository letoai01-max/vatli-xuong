name: Quet bu hinh anh tu Google Drive

on:
  workflow_dispatch:

concurrency:
  group: quet_bu_hinh_anh
  cancel-in-progress: false

jobs:
  quet_anh:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Cài đặt môi trường Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Cài đặt các thư viện phụ trợ
        run: |
          pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -q -r requirements.txt; fi
          if [ -f requirements-docde.txt ]; then pip install -q -r requirements-docde.txt; fi
          pip install -q gspread google-api-python-client google-auth requests pymupdf pillow

      - name: Chay script que bu hinh anh tu Google Drive
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_TRA_PHI: ${{ secrets.GEMINI_API_KEY_TRA_PHI }}
        run: python quet_bu_hinh_anh.py
