# .github/workflows/chi_muc_trung.yml – CHỈ MỤC CHỐNG TRÙNG, 23h00 giờ Việt Nam (trước lượt duyệt câu 23h47)
name: chi_muc_trung
on:
  schedule:
    - cron: "0 16 * * *"
  workflow_dispatch:
# [Mục 32] bỏ concurrency ngan_hang: chi_muc_trung.py chỉ đọc NganHangCauHoi, chỉ ghi tab ChiMucTrung nên chạy song song an toàn
# [BẢO MẬT 31/10/2026] Mặc định chỉ đọc kho; workflow này không ghi lại vào kho.
permissions:
  actions: read
  contents: read

jobs:
  chi_muc:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Cổng ngân sách phút (rẻ – chưa cài thư viện; hoãn thì bỏ qua các bước sau)
        id: cong
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
        run: python3 quota_phut.py --cong
      - uses: actions/setup-python@v5
        if: steps.cong.outputs.chay != 'false'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
        if: steps.cong.outputs.chay != 'false'
      - name: Dựng chỉ mục câu gần trùng
        if: steps.cong.outputs.chay != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python trung_tam.py chi_muc_trung.py
