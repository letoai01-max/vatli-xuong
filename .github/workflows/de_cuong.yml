# Cấu hình GitHub Actions chạy script quét bù hình ảnh
name: run-image-scanner

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      
      - name: Chạy script quet bu hinh anh tu Google Drive
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python quet_bu_hinh_anh.py
