# .github/workflows/de_cuong.yml – SOẠN ĐỀ CƯƠNG BƯỚC 1–5 (gọi từ DeCuongOnTap.gs)
# [29/10/2026] Sửa tên tham số cho KHỚP với Apps Script (ma, goi, ket_qua). Bản cũ khai báo goi_id, kq_id nên
# GitHub từ chối lệnh (lỗi 422) và Apps Script luôn quay về tự soạn. Bỏ khoá trả phí: chỉ dùng khoá miễn phí.
name: de_cuong
on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã đề cương"
        required: false
      goi:
        description: "File ID gói việc (goi_<mã>.json trên Drive)"
        required: true
      ket_qua:
        description: "File ID kết quả (ket_qua_<mã>.json trên Drive)"
        required: true
jobs:
  soan_de_cuong:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Soạn đề cương 5 bước & Kiểm tra số bằng SymPy
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOI_ID: ${{ inputs.goi }}
          KQ_ID: ${{ inputs.ket_qua }}
        run: python trung_tam.py de_cuong.py
