name: de_cuong
on:
  workflow_dispatch:
    inputs:
      goi_id:
        description: "File ID gói việc (goi_<mã>.json trên Drive)"
        required: true
      kq_id:
        description: "File ID kết quả (ket_qua_<mã>.json trên Drive)"
        required: true
jobs:
  soan_de_cuong:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Soạn đề cương 5 bước & Kiểm tra số bằng SymPy
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_TRA_PHI: ${{ secrets.GEMINI_API_KEY_TRA_PHI }}
          GOI_ID: ${{ inputs.goi_id }}
          KQ_ID: ${{ inputs.kq_id }}
        run: python trung_tam.py de_cuong.py
