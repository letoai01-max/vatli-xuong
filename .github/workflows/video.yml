name: video
on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã video (cột Mã trong tab Video)"
        required: true

# [BẢO MẬT 31/10/2026] Lượt chạy chỉ cần đọc mã nguồn; video lưu bằng upload-artifact (không cần quyền ghi kho).
permissions:
  contents: read

jobs:
  dung:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # [BẢO MẬT 31/10/2026] Dữ liệu từ người gọi (inputs.ma) KHÔNG chèn thẳng vào lệnh shell:
    # đi qua biến môi trường MA và được kiểm tra định dạng trước khi dùng.
    env:
      MA: ${{ inputs.ma }}
      WEBAPP_URL: ${{ secrets.WEBAPP_URL }}
      VIDEO_SECRET: ${{ secrets.VIDEO_SECRET }}
    steps:
      - name: Kiểm tra mã video
        run: |
          if [[ ! "$MA" =~ ^[A-Za-z0-9._-]{1,64}$ ]]; then
            echo "Mã video không hợp lệ (chỉ chữ, số, dấu . _ -; tối đa 64 kí tự)."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cài công cụ
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto-core > /dev/null
          pip install -q -r requirements.txt
      - name: Dựng video
        run: python trung_tam.py render.py "$MA"
      - uses: actions/upload-artifact@v4
        with:
          name: video-${{ inputs.ma }}
          path: out/
          retention-days: 2
      - name: Báo xong cho Apps Script
        if: success()
        run: curl -sSL --max-time 90 -G "$WEBAPP_URL" --data-urlencode "a=xong" --data-urlencode "m=$MA" --data-urlencode "run=${{ github.run_id }}" --data-urlencode "t=$VIDEO_SECRET" > /dev/null
      - name: Báo lỗi cho Apps Script
        if: failure()
        run: curl -sSL --max-time 90 -G "$WEBAPP_URL" --data-urlencode "a=loi" --data-urlencode "m=$MA" --data-urlencode "run=${{ github.run_id }}" --data-urlencode "t=$VIDEO_SECRET" > /dev/null
