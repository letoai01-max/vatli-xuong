name: Xu ly Kho Chung

on:
  workflow_dispatch: # Cho phép kích hoạt thủ công hoặc gọi tự động từ Google Apps Script

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install gspread oauth2client google-generativeai

      - name: Run Kho Chung processor
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python kho_chung.py
