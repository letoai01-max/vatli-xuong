name: Xuat De va Du Lieu Python

on:
  workflow_dispatch: # Cho phép bấm nút chạy thủ công trên tab Actions của GitHub
  push:
    branches:
      - main

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests python-docx

      - name: Run xuat_de.py
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          python xuat_de.py

      - name: Commit and push generated files (questions.json, DeThi.docx, images)
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Tự động cập nhật questions.json và DeThi.docx từ GitHub Actions"
          branch: main
