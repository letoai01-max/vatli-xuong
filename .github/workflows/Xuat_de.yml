# .github/workflows/Xuat_de.yml – XUẤT questions.json cho trang điều khiển (index.html)
# 6h giờ Việt Nam (23h UTC) mỗi ngày, hoặc bấm tay.
# SỬA 24/10: bỏ kích hoạt theo mỗi lần push (chạy thừa, lỗi đỏ liên tục); cấp quyền ghi kho;
#            chỉ commit questions.json (xuat_de.py không tạo DeThi.docx).
name: Xuat De va Du Lieu Python
on:
  schedule:
    - cron: "0 23 * * *"
  workflow_dispatch:
permissions:
  contents: write
jobs:
  xuat:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q gspread google-auth
      - name: Xuất questions.json
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
        run: python trung_tam.py xuat_de.py
      - uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Cập nhật questions.json"
          file_pattern: questions.json
