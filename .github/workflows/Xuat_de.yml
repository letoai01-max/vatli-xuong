name: Xuat De va Du Lieu Python

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"

permissions:
  contents: write

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: pip install -q -r requirements.txt

      - name: Run xuat_de.py
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python trung_tam.py xuat_de.py

      - name: Commit and push generated files (questions.json, DeThi.docx)
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Tự động cập nhật questions.json và DeThi.docx từ Kho chung"
          branch: main
          file_pattern: "questions.json DeThi.docx"
