name: Xuat De va Du Lieu Python

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install gspread google-auth requests python-docx

      # 👇 BƯỚC KHẮC PHỤC DỨT ĐIỂM: Tự tạo lại credentials.json từ GitHub Secrets 👇
      - name: Tạo tệp credentials.json an toàn
        run: |
          echo '${{ secrets.GOOGLE_CREDENTIALS }}' > credentials.json

      - name: Run xuat_de.py
        run: |
          python xuat_de.py

      - name: Commit and push generated files (questions.json)
        uses: stefanzweifel/git-auto-commit-action@v4
        with:
          commit_message: "🤖 Tự động cập nhật questions.json từ GitHub Actions"
          branch: main
