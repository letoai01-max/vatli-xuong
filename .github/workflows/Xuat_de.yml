name: Xuat De va Du Lieu Python

on:
  workflow_dispatch:
  schedule:
    - cron: "30 23 * * *"
  repository_dispatch:
    types: [trigger_xuat_de]

permissions:
  contents: write

# [29/10/2026] Không cho hai lượt xuất chạy chồng nhau (lượt sau đợi lượt trước xong)
concurrency:
  group: xuat_de
  cancel-in-progress: false

jobs:
  run-python-script:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies quickly
        run: pip install --no-cache-dir gspread google-auth

      - name: Run xuat_de.py
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: python trung_tam.py xuat_de.py

      # [29/10/2026] Lấy bản mới nhất trước khi commit, tránh bị từ chối khi quet-anh vừa đẩy ảnh lên
      - name: Lấy bản mới nhất trước khi commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git stash --include-untracked
          git pull --rebase origin main
          git stash pop || true

      - name: Commit and push generated files
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "🤖 Tự động cập nhật questions.json tức thì"
          branch: main
          file_pattern: "questions.json"
