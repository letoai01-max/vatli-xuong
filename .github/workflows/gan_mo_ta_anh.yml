# .github/workflows/gan_mo_ta_anh.yml – GẮN MÔ TẢ CHO ẢNH KHO SGK (chạy ngầm tự động hằng ngày 01:30 giờ Việt Nam; vẫn bấm chạy tay được)
# Gemini đọc từng ảnh chưa có mô tả → ghi số hình, nội dung, từ khoá vào ô "Mô tả" của tệp trên Drive để soan_giao_an.py tìm được ảnh.
# Cần: biến KHO_ANH_SGK_ID; tài khoản dịch vụ có quyền "Người chỉnh sửa" trên thư mục kho (chỉ "Người xem" thì dùng tệp out/chi_muc_anh.json).
# [22/11/2026] Thêm lịch cron: mỗi đêm xử lí tối đa 60 ảnh chưa có mô tả (đặt TOI_DA mặc định cho lượt theo lịch), ảnh còn lại để các đêm sau làm tiếp.
#              Thêm khoá GEMINI_API_KEY_1..5 để xoay khoá khi gặp 429. 01:30 giờ VN tránh giờ của duyệt câu (03:47, 23:47) và đọc đề (05:17, 22:17).
name: gan_mo_ta_anh
on:
  schedule:
    # 01:30 giờ Việt Nam mỗi ngày (UTC+7) = 18:30 UTC (ngày hôm trước)
    - cron: "30 18 * * *"
  workflow_dispatch:
    inputs:
      toi_da:
        description: "Số ảnh tối đa xử lí trong lượt này (chạy lại để làm tiếp)"
        required: false
        default: "60"
      lam_lai:
        description: "Viết lại cả các mô tả do máy viết trước đó ([AI])"
        required: false
        default: false
        type: boolean

permissions:
  actions: read
  contents: read

concurrency:
  group: gan_mo_ta_anh
  cancel-in-progress: false

jobs:
  gan:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cài thư viện
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc fonts-noto-core > /dev/null
          pip install -q -r requirements.txt
      - name: Gắn mô tả cho ảnh kho SGK
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          KHO_ANH_SGK_ID: ${{ vars.KHO_ANH_SGK_ID || secrets.KHO_ANH_SGK_ID }}
          # Lượt theo lịch không có inputs → dùng 60; chạy tay thì lấy số đã nhập
          TOI_DA: ${{ inputs.toi_da || '60' }}
          LAM_LAI: ${{ inputs.lam_lai && '1' || '' }}
        run: python trung_tam.py gan_mo_ta_anh.py
      - name: Lưu chỉ mục mô tả
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: chi-muc-anh
          path: out/chi_muc_anh.json
          if-no-files-found: ignore
          retention-days: 30
