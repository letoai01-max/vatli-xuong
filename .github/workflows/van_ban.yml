# .github/workflows/van_ban.yml – Agent văn bản (thay vbChay / vbChayTiep của Apps Script)
name: van-ban
on:
 # schedule:
  #  - cron: '0 19 * * *'         # 19:00 UTC = 02:00 sáng giờ Việt Nam
  workflow_dispatch:
    inputs:
      luot:
        description: 'Lượt thứ mấy trong chuỗi (tự điền khi nối tiếp)'
        required: false
        default: '1'
permissions:
  contents: read
  actions: write                 # để tự gọi lượt nối tiếp (thay cho vbHenLai_)
concurrency:
  group: van-ban
  cancel-in-progress: false
jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chạy Agent văn bản
        id: vb
        env:
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python van_ban.py
      - name: Nối tiếp nếu còn việc (tối đa 3 lượt/đêm)
        if: steps.vb.outputs.con_viec == 'true' && (github.event.inputs.luot || '1') < 3
        env:
          GH_TOKEN: ${{ github.token }}
          LUOT: ${{ github.event.inputs.luot || '1' }}
        run: gh workflow run van_ban.yml -f luot=$((LUOT + 1))
