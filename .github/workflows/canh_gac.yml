# Đường dẫn trong kho: .github/workflows/canh_gac.yml
name: Canh gac

on:
  schedule:
    # 07:20 giờ Việt Nam mỗi ngày (UTC+7) = 00:20 UTC
    - cron: "20 0 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: canh-gac
  cancel-in-progress: false

jobs:
  canh-gac:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      PYTHONUTF8: "1"

    steps:
      - name: Lấy mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Cài thư viện
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then
            pip install -r requirements.txt
          else
            pip install gspread google-auth
          fi

      - name: Chạy canh gác (qua trung tâm điều phối)
        run: python trung_tam.py canh_gac.py

      # Chạy độc lập với Python: canh_gac.py báo đỏ hay sập đều gửi được Telegram
      - name: Báo lỗi khẩn qua Telegram
        if: failure()
        env:
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "Chưa cấu hình TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID, bỏ qua báo Telegram."
            exit 0
          fi
          curl -sS -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendMessage" \
            --data-urlencode "chat_id=${TELEGRAM_CHAT_ID}" \
            --data-urlencode "text=CẢNH BÁO: canh gác hệ thống Vật lí phát hiện sự cố. Xem chi tiết: ${RUN_URL}" \
            > /dev/null
