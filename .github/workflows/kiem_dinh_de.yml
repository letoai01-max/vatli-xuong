# .github/workflows/kiem_dinh_de.yml – KIỂM ĐỊNH MÁY CHO ĐỀ ĐÃ XUẤT (gọi từ NoiCongChatLuong.gs của agent tạo đề)
name: kiem_dinh_de
on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã việc"
        required: false
      goi:
        description: "File ID gói việc (goi_<mã>.json)"
        required: true
      ket_qua:
        description: "File ID kết quả (ket_qua_<mã>.json)"
        required: true
jobs:
  kiem_dinh:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Cổng chất lượng 2 bằng chứng
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GOI_ID: ${{ inputs.goi }}
          KQ_ID: ${{ inputs.ket_qua }}
        run: python trung_tam.py kiem_dinh_de.py
