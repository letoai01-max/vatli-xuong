# .github/workflows/tao_de.yml – AGENT SOẠN ĐỀ THI (soạn → giải lại độc lập → soạn lại câu lệch → kiểm cấu trúc)
name: tao_de
on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã đề"
        required: false
      goi:
        description: "File ID gói việc (goi_de_<mã>.json trên Drive)"
        required: true
      ket_qua:
        description: "File ID kết quả (ket_qua_<mã>.json trên Drive)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  soan_de:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - name: Đăng nhập Google không cần khóa (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/837404998273/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "xuong-tao-de@project-b3c6b9d2-e698-42c2-acb.iam.gserviceaccount.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Agent Python soạn đề thi
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_TRA_PHI: ${{ secrets.GEMINI_API_KEY_TRA_PHI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          TD_HAN_PHUT: "75"
          GOI_ID: ${{ inputs.goi }}
          KQ_ID: ${{ inputs.ket_qua }}
        run: python trung_tam.py tao_de.py
