# .github/workflows/tao_de.yml – SOẠN ĐỀ THI TỰ ĐỘNG (giao thức v2: gói việc + kết quả + 2 tệp Word HS/GV)
name: tao_de
on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã đề"
        required: false
      goi:
        description: "File ID gói việc (goi_de_<mã>.json trên Drive)"
        required: true
      ket_qua:
        description: "File ID kết quả (ket_qua_<mã>.json trên Drive)"
        required: true

permissions:
  contents: read
  id-token: write

jobs:
  soan_de:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: tao-de-${{ inputs.ma }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Đăng nhập Google không cần khóa (WIF)
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: "projects/837404998273/locations/global/workloadIdentityPools/github-pool/providers/github-provider"
          service_account: "xuong-tao-de@project-b3c6b9d2-e698-42c2-acb.iam.gserviceaccount.com"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cài pandoc (xuất Word có phương trình) và thư viện
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc > /dev/null
          pip install -q -r requirements.txt
      - name: Soạn đề thi bằng Python trên GitHub Actions
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_TRA_PHI: ${{ secrets.GEMINI_API_KEY_TRA_PHI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOI_ID: ${{ inputs.goi }}
          KQ_ID: ${{ inputs.ket_qua }}
        run: python trung_tam.py tao_de.py
