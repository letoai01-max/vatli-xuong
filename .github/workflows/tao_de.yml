# .github/workflows/tao_de.yml – SOẠN ĐỀ THI TỰ ĐỘNG (giao thức v2: gói việc + kết quả + 2 tệp Word HS/GV)
name: tao_de
on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã đề"
        required: false
      goi:
        description: "File ID gói việc (goi_de_<mã>.json trên Drive)"
        required: true
      ket_qua:
        description: "File ID kết quả (ket_qua_<mã>.json trên Drive)"
        required: true

permissions:
  actions: read
  contents: read
  id-token: write

jobs:
  soan_de:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: tao-de-${{ inputs.ma }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - name: Đăng nhập Google bằng key JSON
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GOOGLE_CREDENTIALS }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Cài pandoc (xuất Word có phương trình) và thư viện
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc > /dev/null
          pip install -q -r requirements.txt
      - name: Soạn đề thi bằng Python trên GitHub Actions
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_TRA_PHI: ${{ secrets.GEMINI_API_KEY_TRA_PHI }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          GOI_ID: ${{ inputs.goi }}
          KQ_ID: ${{ inputs.ket_qua }}
        run: python trung_tam.py tao_de.py
