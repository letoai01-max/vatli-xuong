# .github/workflows/soan_giao_an.yml – XƯỞNG SOẠN GIÁO ÁN (phần "chờ Gemini"; Apps Script chỉ dựng Docs/Word)
# [14/11/2026] Sửa cho KHỚP soan_giao_an.py: tệp Python không đọc --lop / --so-tiet mà đọc biến môi trường
# GOI_ID + KQ_ID (Apps Script ra lệnh) hoặc TEN_BAI (soạn tay để thử). Bản cũ không truyền biến nào nên luôn báo
# "Không có việc để làm". Bỏ lịch cron vì soan_giao_an.py ghi rõ "chỉ chạy khi được gọi" (lịch riêng nằm bên Apps Script).
# Chỉ dùng khoá miễn phí (không truyền GEMINI_API_KEY_TRA_PHI).
name: soan-giao-an
on:
  workflow_dispatch:
    inputs:
      ma:
        description: "Mã giáo án (Apps Script truyền; có thể bỏ trống)"
        required: false
      goi:
        description: "File ID gói việc goi_<mã>.json (Apps Script truyền; bỏ trống khi soạn tay)"
        required: false
      ket_qua:
        description: "File ID kết quả ket_qua_<mã>.json (Apps Script truyền; bỏ trống khi soạn tay)"
        required: false
      ten_bai:
        description: "SOẠN TAY để thử: tên bài (ví dụ: Bài 1. Dao động điều hòa). Bỏ trống nếu chạy bằng gói việc"
        required: false
      lop:
        description: "Lớp khi soạn tay (10, 11 hoặc 12)"
        required: false
        default: "10"
      yccd:
        description: "Yêu cầu cần đạt (tuỳ chọn, soạn tay)"
        required: false
permissions:
  contents: read
concurrency:
  group: soan-giao-an
  cancel-in-progress: false
jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Cài pandoc (xuất Word có bảng và phương trình) và thư viện
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq pandoc > /dev/null
          pip install -q -r requirements.txt
      - name: Soạn nội dung giáo án
        env:
          PYTHONUNBUFFERED: "1"
          GOI_ID: ${{ inputs.goi }}
          KQ_ID: ${{ inputs.ket_qua }}
          TEN_BAI: ${{ inputs.ten_bai }}
          LOP: ${{ inputs.lop }}
          YCCD: ${{ inputs.yccd }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
        run: python soan_giao_an.py
      - name: Lưu bản Word soạn tay (nếu có)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: giao-an
          path: out/
          if-no-files-found: ignore
