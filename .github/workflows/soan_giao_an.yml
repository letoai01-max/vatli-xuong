# .github/workflows/soan_giao_an.yml – phần "chờ Gemini" của agent giáo án chạy ở đây; Apps Script chỉ dựng Docs/Word
name: soan-giao-an
on:
  schedule:                      # luân phiên: mỗi ngày một lớp (UTC 00:00 = 07:00 giờ Việt Nam)
    - cron: '0 0 * * 1,4'        # thứ Hai, thứ Năm  → lớp 10
    - cron: '0 0 * * 2,5'        # thứ Ba, thứ Sáu   → lớp 11
    - cron: '0 0 * * 3,6'        # thứ Tư, thứ Bảy   → lớp 12
  workflow_dispatch:
    inputs:
      lop:
        description: 'Lớp (10, 11 hoặc 12)'
        required: true
        default: '10'
      so_tiet:
        description: 'Số tiết soạn mỗi lượt'
        required: false
        default: '1'
concurrency:
  group: soan-giao-an
  cancel-in-progress: false
jobs:
  chay:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Chọn lớp theo lịch
        id: lop
        env:
          NHAP_LOP: ${{ github.event.inputs.lop }}
          LICH: ${{ github.event.schedule }}
        run: |
          if [ -n "$NHAP_LOP" ]; then L="$NHAP_LOP"
          else
            case "$LICH" in
              "0 0 * * 1,4") L=10 ;;
              "0 0 * * 2,5") L=11 ;;
              "0 0 * * 3,6") L=12 ;;
              *) echo "Lịch không nhận ra: $LICH"; exit 1 ;;
            esac
          fi
          echo "lop=$L" >> "$GITHUB_OUTPUT"
      - name: Soạn nội dung giáo án
        env:
          LOP: ${{ steps.lop.outputs.lop }}
          SO_TIET: ${{ github.event.inputs.so_tiet || '1' }}
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_TRA_PHI: ${{ secrets.GEMINI_API_KEY_TRA_PHI }}
        run: python soan_giao_an.py --lop "$LOP" --so-tiet "$SO_TIET"
