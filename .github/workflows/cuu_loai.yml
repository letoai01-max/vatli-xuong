name: cuu_loai
on:
  schedule:
    - cron: "17 15 * * *"      # 15:17 UTC = 22:17 giờ VN, TRƯỚC lượt duyet_cau 23:47 → câu vừa cứu được duyệt lại ngay
  workflow_dispatch:
    inputs:
      phut:
        description: "Số phút tối đa cho lượt này"
        required: false
        default: "60"
concurrency:
  group: ngan_hang              # cùng nhóm với duyet_cau: hai việc xếp hàng, không ghi Sheet cùng lúc
  cancel-in-progress: false
permissions:
  actions: read
  contents: read

jobs:
  cuu:
    runs-on: ubuntu-latest
    timeout-minutes: 80
    steps:
      - uses: actions/checkout@v4
      - name: Cổng ngân sách phút (rẻ – chưa cài thư viện; hoãn thì bỏ qua các bước sau)
        id: cong
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
        run: python3 quota_phut.py --cong
      - uses: actions/setup-python@v5
        if: steps.cong.outputs.chay != 'false'
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
        if: steps.cong.outputs.chay != 'false'
      - name: Cứu câu Loại (lỗi tách đề + lỗi hình/đồ thị)
        if: steps.cong.outputs.chay != 'false'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_1: ${{ secrets.GEMINI_API_KEY_1 }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_4: ${{ secrets.GEMINI_API_KEY_4 }}
          GEMINI_API_KEY_5: ${{ secrets.GEMINI_API_KEY_5 }}
          GEMINI_API_KEY_TRA_PHI: ${{ secrets.GEMINI_API_KEY_TRA_PHI }}
          # Số câu / song song / thư mục Drive đã đặt mặc định trong cuu_loai.py; muốn đổi nhanh thì bỏ dấu # ở dòng dưới:
          # CUU_LOAI_TOI_DA: "100"
          # CUU_LOAI_SONG_SONG: "1"
          THOI_GIAN_TOI_DA_PHUT: ${{ inputs.phut || '60' }}
        run: python trung_tam.py cuu_loai.py
