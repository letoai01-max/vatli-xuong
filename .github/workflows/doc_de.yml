name: doc_de
on:
  schedule:
    - cron: "17 15 * * *"
    - cron: "17 22 * * *"
  workflow_dispatch:
    inputs:
      phut:
        description: "Số phút tối đa cho lượt này"
        required: false
        default: "100"
concurrency:
  group: ngan_hang
  cancel-in-progress: false
jobs:
  doc:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -q -r requirements.txt
      - name: Đọc đề tải về → ngân hàng câu hỏi
        env:
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          GEMINI_API_KEY_3: ${{ secrets.GEMINI_API_KEY_3 }}
          GEMINI_API_KEY_TRA_PHI: ${{ secrets.GEMINI_API_KEY_TRA_PHI }}
          THOI_GIAN_TOI_DA_PHUT: ${{ inputs.phut || '100' }}
        run: python trung_tam.py doc_de.py
