name: tim_kiem
on:
  schedule:
    - cron: "40 22 * * *"
    - cron: "40 6 * * *"
  workflow_dispatch:
# [BẢO MẬT 31/10/2026] Mặc định chỉ đọc kho; workflow này không ghi lại vào kho.
permissions:
  actions: read
  contents: read

jobs:
  tim:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Cổng ngân sách phút (rẻ – chưa cài thư viện; hoãn thì bỏ qua các bước sau)
        id: cong
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
        run: python3 quota_phut.py --cong
      - name: Set up Python 3.11
        if: steps.cong.outputs.chay != 'false'
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        if: steps.cong.outputs.chay != 'false'
        run: pip install -q -r requirements.txt
      - name: Tìm sẵn tài liệu cho các chủ đề đang bật
        if: steps.cong.outputs.chay != 'false'
        timeout-minutes: 25
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_BILLING_TOKEN: ${{ secrets.GH_BILLING_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          PYTHONUNBUFFERED: "1"
          GOOGLE_CREDENTIALS: ${{ secrets.GOOGLE_CREDENTIALS }}
          BRAVE_API_KEY: ${{ secrets.BRAVE_API_KEY }}
        run: python trung_tam.py tim_kiem.py
